name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать приложение и установщик
        run: ./make_dmg.sh

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: LayoutFixer-dmg
          path: build/LayoutFixer.dmg

      - name: Выложить в релиз (для тегов vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LayoutFixer.dmg
